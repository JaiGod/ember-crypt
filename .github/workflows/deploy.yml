name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.3"

jobs:
  web:
    name: Smoke test + Web export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import project
        run: godot --headless --import || true
      - name: Smoke test (bot plays to floor 10, dies once, restarts, wins)
        run: |
          timeout 600 godot --headless --fixed-fps 60 --quit-after 60000 -- --smoke 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          ! grep -q "SCRIPT ERROR" smoke.log
      - name: Export Web (threads off)
        run: |
          mkdir -p build/play
          godot --headless --export-release "Web" build/play/index.html
          cp site/index.html build/index.html
          touch build/.nojekyll
          ls -la build build/play
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install templates and editor settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import project
        run: godot --headless --import || true
      - name: Export APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/EmberCrypt.apk
          ls -la build/android
      - name: Publish release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Ember Crypt v1.0.0
          body: "Android debug APK of Ember Crypt. Play in the browser: https://jaigod.github.io/ember-crypt/"
          files: build/android/EmberCrypt.apk
